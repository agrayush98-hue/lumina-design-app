<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password Modal - Lumina Design</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "text-secondary": "#888888",
                        "primary": "#f2c35b",
                        "border": "#222222",
                        "surface-container": "#201f1f",
                        "primary-container": "#d4a843",
                        "panel": "#1a1a1a",
                        "surface-dim": "#131313",
                        "surface-bright": "#3a3939",
                        "surface-container-low": "#1c1b1b",
                        "border-subtle": "#2a2a2a",
                        "on-surface": "#e5e2e1",
                        "surface-container-high": "#2a2a2a",
                        "text-muted": "#555555",
                        "gold-dim": "rgba(212, 168, 67, 0.12)",
                        "background": "#131313",
                        "surface": "#111111",
                        "text-primary": "#cccccc",
                        "surface-variant": "#353534",
                        "on-primary": "#402d00",
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "sm": "2px",
                        "md": "4px",
                        "lg": "6px",
                        "xl": "8px",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "12px",
                        "margin-compact": "8px",
                        "margin-standard": "16px",
                    },
                    fontFamily: {
                        "body-standard": ["Inter"],
                        "headline-section": ["Inter"],
                        "mono-small": ["IBM Plex Mono"],
                        "label-caps": ["Inter"],
                        "mono-value": ["IBM Plex Mono"],
                        "body-medium": ["Inter"],
                        "headline-modal": ["Inter"]
                    },
                    fontSize: {
                        "body-standard": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "headline-section": ["14px", { lineHeight: "20px", fontWeight: "600" }],
                        "mono-small": ["11px", { lineHeight: "14px", fontWeight: "400" }],
                        "label-caps": ["10px", { lineHeight: "12px", letterSpacing: "0.1em", fontWeight: "700" }],
                        "mono-value": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "body-medium": ["13px", { lineHeight: "18px", fontWeight: "500" }],
                        "headline-modal": ["17px", { lineHeight: "24px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-text-primary min-h-screen font-body-standard overflow-hidden relative">
<!-- Backdrop -->
<div class="fixed inset-0 bg-black/40 z-0"></div>
<!-- Main Container for Side-by-Side View -->
<div class="fixed inset-0 z-10 flex flex-col md:flex-row items-center justify-center gap-margin-standard p-margin-standard">
<!-- State 1: Email Entry -->
<div class="w-full max-w-[400px] bg-panel border border-border rounded-lg flex flex-col">
<!-- Header -->
<div class="flex justify-between items-center px-margin-standard py-margin-standard border-b border-border">
<h2 class="font-headline-section text-headline-section text-on-surface uppercase tracking-wider">Reset Password</h2>
<button class="text-text-muted hover:text-text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Body -->
<div class="p-margin-standard flex flex-col gap-margin-standard">
<p class="font-body-standard text-body-standard text-text-secondary">
                    Enter your registered email address to receive a password reset link.
                </p>
<div class="flex flex-col gap-margin-compact">
<label class="font-label-caps text-label-caps text-text-muted uppercase" for="email-input">EMAIL ADDRESS</label>
<input class="bg-surface border border-border-subtle rounded-sm px-3 py-2 font-mono-value text-mono-value text-on-surface focus:outline-none focus:border-primary-container transition-colors w-full" id="email-input" placeholder="engineer@company.com" type="email" value="engineer@company.com"/>
</div>
</div>
<!-- Footer -->
<div class="px-margin-standard py-margin-standard border-t border-border flex justify-end gap-margin-standard items-center bg-surface-container-low rounded-b-lg">
<button class="font-label-caps text-label-caps text-text-muted hover:text-text-primary transition-colors uppercase">
                    Cancel
                </button>
<button class="bg-primary-container text-on-primary font-label-caps text-label-caps uppercase px-4 py-2 rounded-sm hover:brightness-110 transition-all">
                    Send Reset Link
                </button>
</div>
</div>
<!-- State 2: Sent Confirmation -->
<div class="w-full max-w-[400px] bg-panel border border-border rounded-lg flex flex-col items-center justify-center text-center p-8 gap-6">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-gold-dim flex items-center justify-center border border-primary-container/20">
<span class="material-symbols-outlined text-[32px] text-primary-container">mail</span>
</div>
<!-- Body -->
<div class="flex flex-col gap-2">
<h2 class="font-headline-modal text-headline-modal text-on-surface">Reset link sent</h2>
<p class="font-body-standard text-body-standard text-text-secondary max-w-[280px]">
                    Check your inbox at <span class="font-mono-value text-mono-value text-on-surface">engineer@company.com</span> for instructions.
                </p>
</div>
<!-- Footer Action -->
<button class="w-full bg-primary-container text-on-primary font-label-caps text-label-caps uppercase px-4 py-3 rounded-sm hover:brightness-110 transition-all mt-2">
                Back to Sign In
            </button>
</div>
</div>
</body></html>
