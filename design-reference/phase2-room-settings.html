<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumina Design - Room Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#76f5ff",
                        "outline-variant": "#4e4636",
                        "success": "#4ade80",
                        "primary-fixed-dim": "#eec058",
                        "border-subtle": "#2a2a2a",
                        "tertiary-container": "#8eaef4",
                        "on-secondary-fixed-variant": "#004f54",
                        "on-primary-container": "#553e00",
                        "primary-fixed": "#ffdf9f",
                        "inverse-primary": "#795900",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "on-secondary": "#00363a",
                        "tertiary-fixed-dim": "#aec6ff",
                        "on-tertiary-fixed": "#001a42",
                        "secondary": "#53d8e2",
                        "secondary-container": "#00acb6",
                        "surface-dim": "#131313",
                        "on-secondary-container": "#00393d",
                        "surface-container-high": "#2a2a2a",
                        "on-primary-fixed-variant": "#5b4300",
                        "text-secondary": "#888888",
                        "surface-variant": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "surface-tint": "#eec058",
                        "primary": "#f2c35b",
                        "on-tertiary": "#002e6a",
                        "on-primary-fixed": "#261a00",
                        "gold-dim": "rgba(212, 168, 67, 0.12)",
                        "surface": "#111111",
                        "error": "#ffb4ab",
                        "danger": "#ef4444",
                        "outline": "#9a8f7d",
                        "inverse-surface": "#e5e2e1",
                        "primary-container": "#d4a843",
                        "room-fill": "#0f1a0f",
                        "on-tertiary-fixed-variant": "#214584",
                        "on-surface-variant": "#d2c5b1",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#201f1f",
                        "on-primary": "#402d00",
                        "error-container": "#93000a",
                        "on-background": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "text-muted": "#555555",
                        "surface-container-highest": "#353534",
                        "text-primary": "#cccccc",
                        "on-error": "#690005",
                        "tertiary-fixed": "#d8e2ff",
                        "panel": "#1a1a1a",
                        "on-tertiary-container": "#1b407f",
                        "on-secondary-fixed": "#002022",
                        "surface-bright": "#3a3939",
                        "gold-soft": "#f0c97a",
                        "tertiary": "#b3caff",
                        "secondary-fixed-dim": "#53d8e2",
                        "warning": "#f59e0b",
                        "surface-container-lowest": "#0e0e0e",
                        "border": "#222222"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-compact": "8px",
                        "margin-standard": "16px",
                        "header-height": "48px",
                        "sidebar-right": "280px",
                        "gutter": "12px",
                        "sidebar-left": "240px"
                    },
                    "fontFamily": {
                        "headline-section": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-standard": ["Inter"],
                        "mono-small": ["IBM Plex Mono"],
                        "body-medium": ["Inter"],
                        "mono-value": ["IBM Plex Mono"],
                        "headline-modal": ["Inter"]
                    },
                    "fontSize": {
                        "headline-section": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700", "textTransform": "uppercase" }],
                        "body-standard": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "mono-small": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "body-medium": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "mono-value": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-modal": ["17px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .cad-grid {
                background-image: 
                    linear-gradient(to right, #222222 1px, transparent 1px),
                    linear-gradient(to bottom, #222222 1px, transparent 1px);
                background-size: 40px 40px;
            }
            .input-base {
                @apply w-full bg-surface-dim border border-border px-3 py-2 text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none;
            }
            .select-base {
                @apply w-full bg-surface-dim border border-border px-3 py-2 text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none appearance-none;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23888888' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
                background-position: right 0.5rem center;
                background-repeat: no-repeat;
                background-size: 1.5em 1.5em;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center cad-grid">
<!-- Backdrop -->
<div class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center">
<!-- Modal Container -->
<div class="w-[400px] bg-surface border border-border rounded-none shadow-2xl z-50 flex flex-col">
<!-- Header -->
<div class="flex items-center justify-between px-margin-standard py-3 border-b border-border bg-surface-container-high">
<h2 class="font-headline-modal text-headline-modal text-on-surface">Room Settings</h2>
<button class="text-text-secondary hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Body -->
<div class="p-margin-standard flex flex-col gap-6 overflow-y-auto max-h-[calc(100vh-120px)]">
<!-- Section 1: ROOM IDENTITY -->
<div class="flex flex-col gap-3">
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Room Name</label>
<input class="input-base font-body-standard text-body-standard" type="text" value="Open Plan Office 01"/>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Room Type</label>
<select class="select-base font-body-standard text-body-standard">
<option>Office</option>
<option>Retail</option>
<option>Education</option>
<option>Healthcare</option>
</select>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Environment</label>
<select class="select-base font-body-standard text-body-standard">
<option>Clean Office</option>
<option>Industrial</option>
<option>Harsh</option>
</select>
</div>
</div>
</div>
<div class="w-full h-px bg-border"></div>
<!-- Section 2: DIMENSIONS -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<h3 class="font-headline-section text-headline-section text-text-secondary">Dimensions</h3>
<span class="material-symbols-outlined text-text-secondary text-[16px]">straighten</span>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Width (mm)</label>
<input class="input-base font-mono-value text-mono-value" type="text" value="8500"/>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Length (mm)</label>
<input class="input-base font-mono-value text-mono-value" type="text" value="12400"/>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Ceiling Height (m)</label>
<input class="input-base font-mono-value text-mono-value" type="text" value="3.20"/>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">False Ceiling (m)</label>
<input class="input-base font-mono-value text-mono-value" type="text" value="2.80"/>
</div>
<div class="col-span-2">
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Working Plane (m)</label>
<input class="input-base font-mono-value text-mono-value" type="text" value="0.75"/>
</div>
</div>
</div>
<div class="w-full h-px bg-border"></div>
<!-- Section 3: TARGETS -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<h3 class="font-headline-section text-headline-section text-text-secondary">Targets</h3>
<span class="material-symbols-outlined text-text-secondary text-[16px]">track_changes</span>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Target Lux</label>
<input class="input-base font-mono-value text-mono-value border-primary/50" type="text" value="500"/>
<p class="font-body-standard text-body-standard text-text-muted mt-1 text-[10px]">Suggested: 500 lx for Office</p>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Target CCT</label>
<select class="select-base font-mono-value text-mono-value">
<option>3000K</option>
<option selected="">4000K</option>
<option>5000K</option>
<option>6500K</option>
</select>
</div>
</div>
</div>
<div class="w-full h-px bg-border"></div>
<!-- Section 4: REFLECTANCE -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<h3 class="font-headline-section text-headline-section text-text-secondary">Reflectance</h3>
<span class="material-symbols-outlined text-text-secondary text-[16px]">contrast</span>
</div>
<div class="grid grid-cols-3 gap-gutter">
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Ceiling</label>
<select class="select-base font-body-standard text-body-standard px-2 text-center">
<option>White 0.8</option>
<option selected="">Light 0.7</option>
<option>Med 0.5</option>
</select>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Wall</label>
<select class="select-base font-body-standard text-body-standard px-2 text-center">
<option>White 0.8</option>
<option>Light 0.7</option>
<option selected="">Med 0.5</option>
<option>Dark 0.3</option>
</select>
</div>
<div>
<label class="font-label-caps text-label-caps text-text-secondary mb-1 block">Floor</label>
<select class="select-base font-body-standard text-body-standard px-2 text-center">
<option>Light 0.4</option>
<option selected="">Med 0.2</option>
<option>Dark 0.1</option>
</select>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="p-margin-standard border-t border-border bg-surface flex justify-end gap-3 mt-auto">
<button class="px-4 py-2 border border-border text-on-surface font-body-medium text-body-medium rounded-none hover:bg-surface-container-high transition-colors">
                    Cancel
                </button>
<button class="px-4 py-2 bg-primary text-on-primary font-body-medium text-body-medium rounded-none hover:bg-primary-container transition-colors shadow-[0_0_10px_rgba(212,168,67,0.2)]">
                    Save Room
                </button>
</div>
</div>
</div>
</body></html>
