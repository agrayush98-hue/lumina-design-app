<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fixture Configurator Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffdf9f",
                        "on-error-container": "#ffdad6",
                        "gold-dim": "rgba(212, 168, 67, 0.12)",
                        "text-muted": "#555555",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-dim": "#131313",
                        "secondary-fixed-dim": "#53d8e2",
                        "outline": "#9a8f7d",
                        "room-fill": "#0f1a0f",
                        "on-secondary-fixed-variant": "#004f54",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed": "#001a42",
                        "surface-variant": "#353534",
                        "gold-soft": "#f0c97a",
                        "on-tertiary-fixed-variant": "#214584",
                        "inverse-on-surface": "#313030",
                        "on-primary-container": "#553e00",
                        "surface-container-highest": "#353534",
                        "error-container": "#93000a",
                        "surface-bright": "#3a3939",
                        "outline-variant": "#4e4636",
                        "secondary": "#53d8e2",
                        "on-background": "#e5e2e1",
                        "text-primary": "#cccccc",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#002022",
                        "secondary-container": "#00acb6",
                        "surface-container": "#201f1f",
                        "surface": "#111111",
                        "on-primary-fixed-variant": "#5b4300",
                        "secondary-fixed": "#76f5ff",
                        "primary-container": "#d4a843",
                        "on-surface": "#e5e2e1",
                        "on-tertiary": "#002e6a",
                        "danger": "#ef4444",
                        "panel": "#1a1a1a",
                        "success": "#4ade80",
                        "surface-container-high": "#2a2a2a",
                        "inverse-surface": "#e5e2e1",
                        "text-secondary": "#888888",
                        "primary": "#f2c35b",
                        "surface-tint": "#eec058",
                        "primary-fixed-dim": "#eec058",
                        "tertiary-fixed-dim": "#aec6ff",
                        "on-secondary": "#00363a",
                        "warning": "#f59e0b",
                        "on-surface-variant": "#d2c5b1",
                        "border": "#222222",
                        "border-subtle": "#2a2a2a",
                        "tertiary-container": "#8eaef4",
                        "inverse-primary": "#795900",
                        "background": "#131313",
                        "error": "#ffb4ab",
                        "on-primary": "#402d00",
                        "on-tertiary-container": "#1b407f",
                        "on-secondary-container": "#00393d",
                        "tertiary": "#b3caff",
                        "tertiary-fixed": "#d8e2ff",
                        "on-primary-fixed": "#261a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "header-height": "48px",
                        "sidebar-right": "280px",
                        "sidebar-left": "240px",
                        "margin-standard": "16px",
                        "margin-compact": "8px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-standard": ["Inter"],
                        "headline-section": ["Inter"],
                        "headline-modal": ["Inter"],
                        "mono-value": ["IBM Plex Mono"],
                        "mono-small": ["IBM Plex Mono"],
                        "body-medium": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-standard": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-section": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-modal": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "mono-value": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "mono-small": ["11px", { "lineHeight": "14px", "fontWeight": "400" }],
                        "body-medium": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #d4a843;
            cursor: pointer;
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #353534;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="bg-[#0d0d0d] font-body-standard text-body-standard text-text-primary antialiased flex items-center justify-center min-h-screen p-4">
<!-- Modal Backdrop Overlay (Semantic Dimming) -->
<div class="fixed inset-0 bg-black/40 z-40 backdrop-blur-[1px]"></div>
<!-- Modal Container -->
<div class="relative w-full max-w-[400px] bg-surface border border-border rounded-lg shadow-none flex flex-col z-50">
<!-- HEADER -->
<div class="flex items-center justify-between p-4 border-b border-border">
<div class="flex flex-col">
<h2 class="font-label-caps text-[14px] uppercase tracking-widest text-on-surface">CONFIGURE FIXTURE</h2>
<span class="font-body-standard text-[11px] text-text-muted mt-1">COB Downlight - Precision Series</span>
</div>
<button class="text-text-muted hover:text-on-surface transition-colors cursor-pointer w-8 h-8 flex items-center justify-center rounded hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- SCROLLABLE BODY -->
<div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-6 max-h-[716px]">
<!-- SECTION 1: FIXTURE TYPE -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Fixture Type</label>
<div class="grid grid-cols-2 gap-2">
<!-- Selected Card -->
<div class="bg-gold-dim border border-primary-container rounded flex items-center p-3 cursor-pointer group">
<span class="material-symbols-outlined text-primary-container mr-2" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="font-body-standard text-body-standard text-primary-container font-medium">COB Downlight</span>
</div>
<!-- Unselected Cards -->
<div class="bg-panel border border-border rounded flex items-center p-3 cursor-pointer hover:border-text-muted transition-colors">
<span class="material-symbols-outlined text-text-muted mr-2" data-icon="highlight">highlight</span>
<span class="font-body-standard text-body-standard text-text-secondary">SMD Downlight</span>
</div>
<div class="bg-panel border border-border rounded flex items-center p-3 cursor-pointer hover:border-text-muted transition-colors">
<span class="material-symbols-outlined text-text-muted mr-2" data-icon="crop_square">crop_square</span>
<span class="font-body-standard text-body-standard text-text-secondary">Panel Light</span>
</div>
<div class="bg-panel border border-border rounded flex items-center p-3 cursor-pointer hover:border-text-muted transition-colors">
<span class="material-symbols-outlined text-text-muted mr-2" data-icon="track_changes">track_changes</span>
<span class="font-body-standard text-body-standard text-text-secondary">Track Spotlight</span>
</div>
<div class="bg-panel border border-border rounded flex items-center p-3 cursor-pointer hover:border-text-muted transition-colors">
<span class="material-symbols-outlined text-text-muted mr-2" data-icon="horizontal_rule">horizontal_rule</span>
<span class="font-body-standard text-body-standard text-text-secondary">Linear Batten</span>
</div>
<div class="bg-panel border border-border rounded flex items-center p-3 cursor-pointer hover:border-text-muted transition-colors">
<span class="material-symbols-outlined text-text-muted mr-2" data-icon="tungsten">tungsten</span>
<span class="font-body-standard text-body-standard text-text-secondary">High Bay</span>
</div>
</div>
</div>
<!-- SECTION 2: SPECIFICATIONS -->
<div class="space-y-5 border-t border-border pt-5">
<!-- Wattage -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex justify-between">
<span>WATTAGE</span>
</label>
<div class="flex items-center gap-3">
<input class="flex-1" max="200" min="5" type="range" value="25"/>
<div class="relative w-20">
<input class="w-full bg-surface border border-border rounded px-2 py-1.5 font-mono-value text-mono-value text-on-surface focus:border-primary-container focus:ring-0 outline-none pr-6 text-right" type="number" value="25"/>
<span class="absolute right-2 top-1/2 -translate-y-1/2 font-mono-small text-text-muted">W</span>
</div>
</div>
</div>
<!-- Beam Angle -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex justify-between">
<span>BEAM ANGLE</span>
</label>
<div class="flex items-center gap-3">
<input class="flex-1" max="120" min="15" type="range" value="45"/>
<div class="relative w-20">
<input class="w-full bg-surface border border-border rounded px-2 py-1.5 font-mono-value text-mono-value text-on-surface focus:border-primary-container focus:ring-0 outline-none pr-6 text-right" type="number" value="45"/>
<span class="absolute right-2 top-1/2 -translate-y-1/2 font-mono-small text-text-muted">°</span>
</div>
</div>
</div>
<!-- Lumens (Calculated) -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-text-muted uppercase">LUMENS (CALCULATED)</label>
<div class="bg-surface-container-low border border-border rounded px-3 py-2 flex items-center">
<span class="font-mono-value text-mono-value text-text-secondary w-full text-right">1200 lm</span>
</div>
</div>
<!-- CCT -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">CCT</label>
<div class="flex border border-border rounded overflow-hidden">
<button class="flex-1 py-1.5 bg-panel text-text-secondary font-body-standard text-[11px] border-r border-border hover:bg-surface-container-high transition-colors">2700K</button>
<button class="flex-1 py-1.5 bg-gold-dim text-primary-container font-body-standard text-[11px] border-r border-border font-medium">3000K</button>
<button class="flex-1 py-1.5 bg-panel text-text-secondary font-body-standard text-[11px] border-r border-border hover:bg-surface-container-high transition-colors">4000K</button>
<button class="flex-1 py-1.5 bg-panel text-text-secondary font-body-standard text-[11px] border-r border-border hover:bg-surface-container-high transition-colors">5000K</button>
<button class="flex-1 py-1.5 bg-panel text-text-secondary font-body-standard text-[11px] hover:bg-surface-container-high transition-colors">6500K</button>
</div>
</div>
<!-- CRI -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">COLOR RENDERING INDEX (CRI)</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="hidden peer" name="cri" type="radio"/>
<div class="w-3 h-3 rounded-full border border-text-muted peer-checked:border-primary-container peer-checked:border-[3px] transition-all"></div>
<span class="font-body-standard text-[11px] text-text-secondary peer-checked:text-on-surface">CRI70</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="hidden peer" name="cri" type="radio"/>
<div class="w-3 h-3 rounded-full border border-text-muted peer-checked:border-primary-container peer-checked:border-[3px] transition-all"></div>
<span class="font-body-standard text-[11px] text-text-secondary peer-checked:text-on-surface">CRI80</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="hidden peer" name="cri" type="radio"/>
<div class="w-3 h-3 rounded-full border border-text-muted peer-checked:border-primary-container peer-checked:border-[4px] transition-all"></div>
<span class="font-body-standard text-[11px] text-text-secondary peer-checked:text-on-surface">CRI90</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="hidden peer" name="cri" type="radio"/>
<div class="w-3 h-3 rounded-full border border-text-muted peer-checked:border-primary-container peer-checked:border-[3px] transition-all"></div>
<span class="font-body-standard text-[11px] text-text-secondary peer-checked:text-on-surface">CRI95</span>
</label>
</div>
</div>
<!-- Protocol & IP Rating Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">CONTROL PROTOCOL</label>
<div class="relative">
<select class="w-full bg-surface border border-border rounded px-3 py-2 font-body-standard text-body-standard text-on-surface appearance-none focus:border-primary-container focus:ring-0 outline-none">
<option>NON-DIM</option>
<option>TRIAC</option>
<option selected="">DALI</option>
<option>ZIGBEE</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">INGRESS PROTECTION (IP)</label>
<div class="relative">
<select class="w-full bg-surface border border-border rounded px-3 py-2 font-body-standard text-body-standard text-on-surface appearance-none focus:border-primary-container focus:ring-0 outline-none">
<option selected="">IP20</option>
<option>IP44</option>
<option>IP54</option>
<option>IP65</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
</div>
</div>
<!-- FOOTER -->
<div class="p-4 border-t border-border bg-surface flex justify-between items-center rounded-b-lg">
<button class="px-4 py-2 bg-transparent border border-border text-on-surface font-body-medium text-body-medium rounded hover:bg-surface-container-high transition-colors">
                Cancel
            </button>
<button class="px-4 py-2 bg-primary text-on-primary font-body-medium text-body-medium font-semibold rounded hover:bg-surface-tint transition-colors flex items-center gap-2">
                ADD TO CANVAS
                <span class="bg-on-primary/20 text-on-primary rounded-sm px-1.5 py-0.5 text-[10px] font-mono-small font-bold">1</span>
</button>
</div>
</div>
</body></html>
